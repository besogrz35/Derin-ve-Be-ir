<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kovalamaca ❤️</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
canvas.drag{cursor:grabbing;}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);text-align:center;
  max-width:calc(100% - 190px);background:rgba(255,255,255,.88);color:#5a3a44;font-size:16px;pointer-events:none;padding:7px 16px;border-radius:999px;}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);display:none;
  max-width:calc(100% - 28px);width:max-content;background:#fff;color:#4a2a34;border:3px solid #e8365d;border-radius:18px;padding:12px 18px;
  font-size:clamp(16px,3.4vw,24px);font-weight:700;text-align:center;white-space:pre-line;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25);}
#banner.scream{border-color:#d11;color:#d11;font-size:clamp(22px,5.5vw,38px);}
#trk,#who{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.88);font-size:20px;cursor:pointer;}
#trk{right:58px;}#who{left:12px;}
#pick{position:fixed;inset:0;background:rgba(40,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px;}
#pick .card{background:#fff;border-radius:22px;padding:20px;max-width:420px;width:100%;text-align:center;color:#4a2a34;}
#pick h2{margin:0 0 14px;font-size:22px;}
#pick .row{display:flex;gap:12px;flex-wrap:wrap;}
#pick #pm{flex-basis:100%;background:#2a1a26;border-color:#8b1c2c;color:#f2e6f0;}
#pick #pm:hover,#pick #pm:focus-visible{background:#4a1a2a;}
#pick small{font-weight:400;font-size:12px;opacity:.8;}
#pick .pmi{font-size:34px;}
#quiz{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:6;padding:16px;}
#quiz .card{background:#1a1420;color:#f2e6f0;border:2px solid #8b1c2c;border-radius:20px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(180,0,40,.5);}
#quiz h3{margin:0 0 16px;font-size:20px;}
#quiz button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:14px;border:2px solid #8b1c2c;background:#2a1a26;color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;}
#quiz button:hover,#quiz button:focus-visible{background:#5a1a2a;outline:none;}
#pick button{flex:1;border:3px solid #e8365d;background:#fff4f6;border-radius:18px;padding:10px;cursor:pointer;font:inherit;font-weight:700;font-size:18px;color:#4a2a34;display:flex;flex-direction:column;align-items:center;gap:6px;}
#pick button:hover,#pick button:focus-visible{background:#ffe3ea;outline:none;}
#pick img{height:110px;max-width:100%;object-fit:contain;}
#pick p{margin:12px 0 0;font-size:14px;color:#7a5a63;}
#lyrics{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:none;max-width:calc(100% - 24px);width:max-content;background:rgba(30,10,30,.8);color:#fff;border-radius:18px;padding:14px 20px;text-align:center;font-size:clamp(18px,4vw,28px);z-index:3;}
#lyrics small{display:block;opacity:.6;font-size:.7em;margin-bottom:6px;}
#lyrics button{display:block;margin:12px auto 0;border:0;border-radius:999px;background:#e8365d;color:#fff;font:inherit;font-size:18px;padding:10px 22px;cursor:pointer;}
#snd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.88);font-size:20px;cursor:pointer;}
#snd:focus-visible{outline:3px solid #3b6fb6;}
#scenes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.88);border-radius:999px;max-width:calc(100% - 16px);overflow-x:auto;}
#scenes button{border:0;background:transparent;color:#5a3a44;font:inherit;font-size:14px;padding:8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;}
#scenes button.on{background:#e8365d;color:#fff;}
#scenes button:focus-visible{outline:3px solid #3b6fb6;outline-offset:1px;}
</style>
</head>

<div id="lyrics"></div>

/* update */
function update(dt){
  if(role==="maze"){mzUpdate(dt);return;}
  const busy=cs||act||fin;
  curSp=(started&&!busy)?230+Math.min(150,tm*3):0;
  world+=curSp*dt;
  if(bnT>0){bnT-=dt;if(bnT<=0)bn.style.display="none";}
  girl.bs+=(girl.bt-girl.bs)*Math.min(1,dt*3);boy.bs+=(boy.bt-boy.bs)*Math.min(1,dt*3);
  if(started&&!busy){
    tm+=dt;inv-=dt;
    spawnO-=dt;if(spawnO<=0){if(bouquetT<=0)spawnObs();spawnO=Math.max(1.2,2.2-tm*.01)+rnd()*.8;}
    spawnP-=dt;if(spawnP<=0){spawnPick();spawnP=7+rnd()*3;}
    if(bouquetT>0){bouquetT-=dt;if(!giftSpawned&&bouquetT<5){giftSpawned=true;const l=freeLane();picks.push({k:3,x:W+70,y:laneY(l),l});}}
    girl.phase+=curSp*dt*.05;boy.phase+=curSp*dt*.05;
    const m=Math.floor(world/60);if(m!==lastM){lastM=m;msg.textContent="🏃 "+m+" m";}
    if(role==="girl"){evT-=dt;if(evT<=0){startAct(rnd()<.5?5:6);evT=22+rnd()*12;}}
    fartT-=dt;if(fartT<=0){doFart();fartT=12+rnd()*8;}
    bubT-=dt;if(bubT<=0&&!bub){bub={t:0,max:2.2,txt:PH[Math.floor(rnd()*PH.length)]};bubT=3+rnd()*2.5;}
    if(role==="girl"&&world>=60000&&!act)startFin();
  }
  if(bub){bub.t+=dt;if(bub.t>bub.max)bub=null;}
  for(const o of obs){o.x-=curSp*dt;if(bouquetT>0)o.a=Math.max(0,o.a-dt*2);}
  obs=obs.filter(o=>o.x>-120&&o.a>0);
  for(const p of picks)p.x-=curSp*dt;
  picks=picks.filter(p=>p.x>-120&&!p.dead);
  if(dragging&&!cs&&!act&&!fin){
    if(role==="boy"){const dx=tgt.x-pl.x,dy=tgt.y-pl.y,d=Math.hypot(dx,dy);if(d>1){const s=Math.min(d,330*dt);pl.x+=dx/d*s;pl.y+=dy/d*s;}}
    else{pl.x=tgt.x;pl.y=tgt.y;}
  }
  if(!cs&&!fin){
    if(role==="girl"){boy.x+=((girl.x-GAP)-boy.x)*Math.min(1,dt*3);boy.y+=(girl.y-boy.y)*Math.min(1,dt*3);}
    else if(started&&!act)aiGirl(dt);
  }
  if(act)actUpdate(dt);
  else if(cs)cutUpdate(dt);
  else if(fin)finUpdate(dt);
  else if(started){
    if(inv<=0&&bouquetT<=0)for(const o of obs)if(Math.abs(o.x-pl.x)<o.w/2+16&&Math.abs(o.y-pl.y)<26){startCut();break;}
    if(!cs)for(const p of picks)if(Math.abs(p.x-pl.x)<46&&Math.abs(p.y-pl.y)<36){collect(p);break;}
    if(!cs&&!act&&role==="boy"&&Math.abs(girl.x-boy.x)<40&&Math.abs(girl.y-boy.y)<24)startCatch();
  }
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.r+=q.vr*dt;if(q.k===1)q.x+=Math.sin(q.life*3+q.r)*20*dt;}
  parts=parts.filter(q=>q.life<q.max);
  if(flash>0)flash-=dt*2;
}

const MZ={C:19,R:15,CS:80,T:10};
const mz={cells:[],x:0,y:0,ph:0,fat:0,lives:3,state:"play",hint:0,slow:0,inv:0,t:0,time:0,gates:[],traps:[],items:[],ghost:{on:false,x:0,y:0,rt:0},nxtE:null,nxtP:null,check:{x:0,y:0},path:[],camX:0,camY:0,after:null,exk:-1,flick:0,amb:8,hbt:0,last:"",moving:false,gate:null,exit:0};
const QS=[{q:"Beşir ile Derin ilk hangi gün tanıştı?",o:["4 Ekim","5 Ekim","3 Ekim"],a:0},{q:"Beşir ile Derin ilk dateyi ne zaman yaptı?",o:["23 Ocak","24 Ocak","25 Ocak"],a:2}];

const cc=c=>({x:(c%MZ.C)*MZ.CS+MZ.CS/2,y:Math.floor(c/MZ.C)*MZ.CS+MZ.CS/2});
const cellOf=(x,y)=>Math.min(MZ.R-1,Math.max(0,Math.floor(y/MZ.CS)))*MZ.C+Math.min(MZ.C-1,Math.max(0,Math.floor(x/MZ.CS)));
function mzBfs(src){
  const C=MZ.C,n=C*MZ.R,nx=new Int16Array(n).fill(-2),q=[src];nx[src]=-1;
  for(let h=0;h<q.length;h++){const c=q[h],w=mz.cells[c].w,nb=[];
    if(!w[0])nb.push(c-C);if(!w[1])nb.push(c+1);if(!w[2])nb.push(c+C);if(!w[3])nb.push(c-1);
    for(const b of nb)if(nx[b]===-2){nx[b]=c;q.push(b);}}
  return nx;
}
function mzGen(){
  const C=MZ.C,R=MZ.R,n=C*R,cells=[];for(let i=0;i<n;i++)cells.push({w:[1,1,1,1]});
  const vis=new Uint8Array(n),st=[0],D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];vis[0]=1;
  while(st.length){const c=st[st.length-1],x=c%C,y=(c/C)|0,op=[];
    for(const d of D){const nx=x+d[0],ny=y+d[1];if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[ny*C+nx])op.push([ny*C+nx,d[2],d[3]]);}
    if(!op.length){st.pop();continue;}
    const o=op[Math.floor(rnd()*op.length)];cells[c].w[o[1]]=0;cells[o[0]].w[o[2]]=0;vis[o[0]]=1;st.push(o[0]);}
  mz.cells=cells;const ex=n-1;mz.exit=ex;mz.nxtE=mzBfs(ex);
  const path=[];let c=0;while(c!==ex){path.push(c);c=mz.nxtE[c];}path.push(ex);mz.path=path;
  const on=new Set(path),man=(a,b)=>Math.abs(a%C-b%C)+Math.abs(((a/C)|0)-((b/C)|0));
  mz.gates=[0,1].map((q,i)=>{const ci=path[Math.floor(path.length*(i?.68:.32))],p=cc(ci);return{ci,q,done:false,x:p.x,y:p.y};});
  const open=c=>cells[c].w.filter(v=>!v).length,off=[],dead=[];
  for(let i=1;i<n-1;i++)if(!on.has(i)&&man(i,0)>3){off.push(i);if(open(i)===1)dead.push(i);}
  const shuf=a=>a.sort(()=>rnd()-.5),used=new Set(),tr=[];
  for(const c of shuf(dead.slice()))if(tr.length<16&&rnd()<.85){tr.push(c);used.add(c);}
  for(const c of shuf(off.slice())){if(tr.length>=28)break;if(!used.has(c)&&rnd()<.1){tr.push(c);used.add(c);}}
  const TT=["ghost","spikes","web","hand","spikes","web","ghost","hand"];
  mz.traps=tr.map(c=>{const p=cc(c);return{ci:c,x:p.x,y:p.y,k:TT[Math.floor(rnd()*TT.length)],used:false,cd:0};});
  mz.items=[];const pool=shuf(off.filter(c=>!used.has(c)));
  for(const k of[0,1,2,3,0,1,2,3]){const i=pool.findIndex(c=>mz.items.every(it=>man(it.ci,c)>=5));if(i<0)break;const c=pool.splice(i,1)[0],p=cc(c);mz.items.push({k,ci:c,x:p.x,y:p.y,got:false});}

  for(const c of shuf([...Array(n).keys()].filter(c=>c>0&&c<n-1&&!taken.has(c)&&man(c,0)>2))){if(mz.closets.length>=7)break;if(mz.closets.every(k=>man(k.ci,c)>=5)){const p=cc(c);mz.closets.push({ci:c,x:p.x,y:p.y,cd:0});}}
}
function mzHud(){const t="❤️".repeat(Math.max(0,mz.lives))+" · "+(mz.hidden?"🫥 Saklandınız (dokununca çıkarsınız)":mz.hint>0?"🧭 "+Math.ceil(mz.hint)+" sn":"Çıkışı bul");if(t!==mz.last){mz.last=t;msg.textContent=t;}}

function mzHit(x,y){
  const r=15,{C,R,CS,T}=MZ,cx=Math.floor(x/CS),cy=Math.floor(y/CS);
  const h=(rx,ry,rw,rh)=>{const nx=Math.max(rx,Math.min(x,rx+rw)),ny=Math.max(ry,Math.min(y,ry+rh));return(x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r;};
  for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){if(i<0||j<0||i>=C||j>=R)continue;const w=mz.cells[j*C+i].w;
    if(w[0]&&h(i*CS-T/2,j*CS-T/2,CS+T,T))return true;
    if(w[3]&&h(i*CS-T/2,j*CS-T/2,T,CS+T))return true;
    if(i===C-1&&w[1]&&h((i+1)*CS-T/2,j*CS-T/2,T,CS+T))return true;
    if(j===R-1&&w[2]&&h(i*CS-T/2,(j+1)*CS-T/2,CS+T,T))return true;}

function ghostCatch(){if(rnd()<.8)mzHurt(true);else{say("Hayalet ıskaladı! 😮",1.8);sfx("lost");mz.inv=2;}}

function mzFar(){const C=MZ.C,pc=cellOf(mz.x,mz.y);let best=0;for(let k=0;k<40;k++){const c=Math.floor(rnd()*C*MZ.R),d=Math.abs(c%C-pc%C)+Math.abs(((c/C)|0)-((pc/C)|0));best=c;if(d>9)break;}const p=cc(best);mz.ghost.x=p.x;mz.ghost.y=p.y;}

function mzGet(k){

function mzUpdate(dt){
  if(picking)return;
  if(bnT>0){bnT-=dt;if(bnT<=0)bn.style.display="none";}
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.r+=q.vr*dt;if(q.k===1)q.x+=Math.sin(q.life*3+q.r)*20*dt;}

  if(mz.state==="scare"){mz.t+=dt;if(mz.t>=1.1){mz.state="play";const a=mz.after;mz.after=null;if(a)a();}return;}

    if(k!==mz.exk){mz.exk=k;say(["Barfiks! 💪","Şınav! 💪","Bench press! 💪"][k],2.4);sfx("lift");}
    if(mz.t>=7.5){mz.state="play";say("Göbekler eridi! 💪 Yol gösteriliyor"+(mz.vanMsg?"\n👻 Hayalet kayboldu!":""),2.8);}
    return;}
  if(mz.state!=="play")return;

  if(rnd()<dt*.12)mz.flick=.3;
  mz.amb-=dt;if(mz.amb<=0){sfx("creak");mz.amb=9+rnd()*8;}
  let moving=false;

    if(d>6){const st=Math.min(d,(mz.slow>0?70:170)*dt),nx=mz.x+dx/d*st,ny=mz.y+dy/d*st;let mvd=false;
      if(!mzHit(nx,mz.y)){mz.x=nx;mvd=true;}if(!mzHit(mz.x,ny)){mz.y=ny;mvd=true;}

  for(const g of mz.gates)if(!g.done&&dist(g)<36){mzQuiz(g);return;}
  for(const t of mz.traps){t.cd-=dt;const d=dist(t);
    if(t.k==="ghost"&&!t.used&&d<44){t.used=true;ghostCatch();return;}
    if(t.k==="spikes"&&d<28&&mz.inv<=0&&t.cd<=0){t.cd=2;say("AAAAAAA diken! 🩸",1.6,"scream");mzHurt(false);if(mz.state!=="play")return;}
    if(t.k==="web"&&d<32){if(mz.slow<=0&&t.cd<=0){say("Örümcek ağına yakalandınız! 🕸️",1.8);sfx("lost");t.cd=3;}mz.slow=3;}
    if(t.k==="hand"&&d<30&&t.cd<=0){t.cd=3;say("Kemik eli sizi geri çekti! 💀",2.2,"scream");mzScare(()=>{mz.x=mz.check.x;mz.y=mz.check.y;endDrag();});return;}
  }
  for(const it of mz.items)if(!it.got&&dist(it)<30){it.got=true;mzGet(it.k);if(mz.state!=="play")return;}

        if(gh.sr<=0){gh.sr=.8;if(rnd()<.3){gh.search=0;mz.hidden.cd=5;mz.hidden=null;say("Hayalet sizi buldu! 😱",1.6);mzFar();ghostCatch();return;}}

function ghost(x,y,s,a,mad){

  ctx.fillStyle="#111";ctx.beginPath();ctx.ellipse(0,-2,mad?11:7,mad?16:6,0,0,6.28);ctx.fill();ctx.restore();

function headphones(x,y){ctx.strokeStyle="#222";ctx.lineWidth=7;ctx.beginPath();ctx.arc(x,y,24,Math.PI,0);ctx.stroke();ctx.fillStyle="#e8365d";ctx.fillRect(x-31,y-4,14,26);ctx.fillRect(x+17,y-4,14,26);}
function dumbbell(x,y){ctx.strokeStyle="#bbb";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-34,y);ctx.lineTo(x+34,y);ctx.stroke();ctx.fillStyle="#333";ctx.fillRect(x-34,y-18,12,36);ctx.fillRect(x+22,y-18,12,36);ctx.fillRect(x-44,y-12,9,24);ctx.fillRect(x+35,y-12,9,24);}
function sweat(x,y){ctx.fillStyle="#ff7aa2";ctx.beginPath();ctx.moveTo(x-18,y-24);ctx.lineTo(x+18,y-24);ctx.lineTo(x+42,y-4);ctx.lineTo(x+32,y+8);ctx.lineTo(x+22,y-2);ctx.lineTo(x+22,y+26);ctx.lineTo(x-22,y+26);ctx.lineTo(x-22,y-2);ctx.lineTo(x-32,y+8);ctx.lineTo(x-42,y-4);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";heartPath(x,y+6,12);ctx.fill();}
function mzItem(it,now){ctx.save();ctx.translate(it.x,it.y-4+Math.sin(now/300+it.x)*3);ctx.scale(.6,.6);
  if(it.k===0)headphones(0,0);else if(it.k===1)bouquet(0,0);else if(it.k===2)dumbbell(0,0);else sweat(0,0);ctx.restore();}
function mzCloset(c,now){const hd=mz.hidden===c;ctx.fillStyle="#5a3b22";ctx.fillRect(c.x-18,c.y-30,36,58);ctx.fillStyle="#7a5230";ctx.fillRect(c.x-15,c.y-27,13,52);ctx.fillRect(c.x+2,c.y-27,13,52);circ(c.x-5,c.y,2,"#d8b45a");circ(c.x+5,c.y,2,"#d8b45a");
  if(hd){ctx.fillStyle="#000";ctx.fillRect(c.x-6,c.y-20,12,9);circ(c.x-3,c.y-16,2,"#fff");circ(c.x+3,c.y-16,2,"#fff");}}
function mzTrap(t,now){
  if(t.k==="ghost"){if(!t.used)ghost(t.x,t.y,.8,.55+.15*Math.sin(now/300),false);}
  else if(t.k==="spikes"){ctx.fillStyle="#9aa0a8";for(const[dx,dy]of[[-16,-8],[0,-12],[16,-8],[-8,10],[8,10]]){ctx.beginPath();ctx.moveTo(t.x+dx-7,t.y+dy+10);ctx.lineTo(t.x+dx,t.y+dy-10);ctx.lineTo(t.x+dx+7,t.y+dy+10);ctx.fill();}ctx.fillStyle="rgba(150,0,20,.5)";ctx.fillRect(t.x-22,t.y+12,44,4);}
  else if(t.k==="web"){ctx.strokeStyle="rgba(230,230,240,.6)";ctx.lineWidth=1.5;for(let a=0;a<8;a++){ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x+Math.cos(a*.785)*32,t.y+Math.sin(a*.785)*32);ctx.stroke();}
    for(const r of[10,20,30]){ctx.beginPath();ctx.arc(t.x,t.y,r,0,6.28);ctx.stroke();}}
  else{ctx.font="30px serif";ctx.textAlign="center";ctx.fillText("💀",t.x,t.y+10);}
}
function mzCouple(x,y){
  ctx.save();ctx.translate(x,y+4);ctx.scale(.4,.4);const m=mz.moving;
  figure({x:-39,y:0,phase:mz.ph},girlImg,"#d6456b",m,{hold:1,belly:mz.fat});
  figure({x:39,y:0,phase:mz.ph+1.2},boyImg,"#3b6fb6",m,{hold:-1,belly:mz.fat});
  ctx.restore();
}
function headAt(img,cx,cy,h){if(img.complete&&img.naturalWidth){const w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,cx-w/2,cy-h/2,w,h);}}
function exLine(a,b,c,d,col,wd){ctx.strokeStyle=col;ctx.lineWidth=wd||10;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function mzExercise(t){
  const k=Math.min(2,Math.floor(t/2.5)),p=(1-Math.cos((t%2.5)*5))/2,s=Math.min(1,W/640,H/520),bl=Math.max(0,34*ss(Math.min(1,t/.35))*(1-t/7.5));
  ctx.save();ctx.fillStyle="rgba(8,8,18,.92)";ctx.fillRect(0,0,W,H);ctx.translate(W/2,H*.52);ctx.scale(s,s);
  ctx.fillStyle="#2b2f3a";ctx.fillRect(-W/s,70,2*W/s,H/s);
  for(const[x,img,col]of[[-120,girlImg,"#d6456b"],[120,boyImg,"#3b6fb6"]]){
    const belly=(cx,cy)=>{ctx.fillStyle="#ffd0da";ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,bl,0,6.28);ctx.fill();ctx.stroke();};
    if(k===0){const sy=-116+(1-p)*50;
      exLine(x-50,-150,x+50,-150,"#bbb",8);exLine(x-50,-150,x-50,70,"#666",6);exLine(x+50,-150,x+50,70,"#666",6);
      exLine(x,sy,x-18,-150,col,10);exLine(x,sy,x+18,-150,col,10);exLine(x,sy,x,sy+62,col,12);exLine(x,sy+62,x-12,sy+120,col,11);exLine(x,sy+62,x+12,sy+120,col,11);
      belly(x+14,sy+36);headAt(img,x,sy-48,100);
    }else if(k===1){const gy=64,sy=gy-30-34*p;
      exLine(x-70,gy,x+60,sy,col,12);exLine(x+60,sy,x+60,gy,col,10);belly(x-6,sy+(gy-sy)*.45+22);headAt(img,x+84,sy-30,96);
    }else{const by=38,bar=by-50-48*p;
      ctx.fillStyle="#555";ctx.fillRect(x-80,by,150,14);ctx.fillRect(x-70,by+14,10,32);ctx.fillRect(x+50,by+14,10,32);
      exLine(x-58,by-6,x+30,by-6,col,12);exLine(x+30,by-6,x+56,by+26,col,11);exLine(x+56,by+26,x+56,by+60,col,11);
      belly(x-8,by-30);headAt(img,x-78,by-22,84);exLine(x-30,by-8,x-30,bar,col,9);
      exLine(x-72,bar,x+12,bar,"#ccc",7);ctx.fillStyle="#222";ctx.fillRect(x-80,bar-18,10,36);ctx.fillRect(x+10,bar-18,10,36);}
  }
  ctx.restore();
}
function mzRender(now){
  ctx.clearRect(0,0,W,H);
  const{C,R,CS,T}=MZ,mw=C*CS,mh=R*CS;
  const camX=mw>W?Math.min(Math.max(mz.x-W/2,0),mw-W):(mw-W)/2,camY=mh>H?Math.min(Math.max(mz.y-H/2,0),mh-H):(mh-H)/2;mz.camX=camX;mz.camY=camY;
  ctx.fillStyle="#0b0810";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-camX,-camY);
  const i0=Math.max(0,Math.floor(camX/CS)),i1=Math.min(C-1,Math.floor((camX+W)/CS)),j0=Math.max(0,Math.floor(camY/CS)),j1=Math.min(R-1,Math.floor((camY+H)/CS));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const x=i*CS,y=j*CS;
    ctx.fillStyle=(i+j)&1?"#1b1722":"#19151f";ctx.fillRect(x,y,CS,CS);
    if(hs(i*131+j*7)<.14){ctx.fillStyle="rgba(110,10,20,.45)";ctx.beginPath();ctx.ellipse(x+hs(i+j*5)*CS,y+hs(i*3+j)*CS,10+hs(i*9)*14,6+hs(j*9)*8,hs(i+j)*3,0,6.28);ctx.fill();}}
  const ec=cc(mz.exit);ctx.fillStyle="#0d3d1f";ctx.fillRect(ec.x-26,ec.y-34,52,68);ctx.fillStyle="rgba(57,212,106,"+(.55+.3*Math.sin(now/300))+")";ctx.fillRect(ec.x-20,ec.y-28,40,56);txt("ÇIKIŞ",ec.x,ec.y+4,12,"#fff");
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const w=mz.cells[j*C+i].w;
    ctx.fillStyle="#3b3445";
    if(w[0])ctx.fillRect(i*CS-T/2,j*CS-T/2,CS+T,T);if(w[3])ctx.fillRect(i*CS-T/2,j*CS-T/2,T,CS+T);
    if(i===C-1&&w[1])ctx.fillRect((i+1)*CS-T/2,j*CS-T/2,T,CS+T);if(j===R-1&&w[2])ctx.fillRect(i*CS-T/2,(j+1)*CS-T/2,CS+T,T);
    ctx.fillStyle="#5a5068";if(w[0])ctx.fillRect(i*CS-T/2,j*CS-T/2,CS+T,3);}
  for(const g of mz.gates)if(!g.done){circ(g.x,g.y,24+2*Math.sin(now/200),"rgba(120,10,30,.8)");ctx.strokeStyle="#ff4a63";ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.x,g.y,24,0,6.28);ctx.stroke();txt("?",g.x,g.y+10,30,"#ffd23f");}
  for(const t of mz.traps)mzTrap(t,now);
  for(const it of mz.items)if(!it.got)mzItem(it,now);
  for(const c of mz.closets)mzCloset(c,now);
  if(!mz.hidden)mzCouple(mz.x,mz.y);
  ctx.restore();
  const sx=mz.x-camX,sy=mz.y-camY-10,R0=120+Math.sin(now/130)*5-(mz.flick>0?35:0);
  const gr=ctx.createRadialGradient(sx,sy,6,sx,sy,R0);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(.5,"rgba(0,0,0,.08)");gr.addColorStop(1,"rgba(0,0,0,.97)");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-camX,-camY);
  if(mz.hint>0){const pts=[[mz.x,mz.y]];let c=cellOf(mz.x,mz.y);while(c!==mz.exit&&pts.length<400){c=mz.nxtE[c];if(c<0)break;const p=cc(c);pts.push([p.x,p.y]);}
    ctx.strokeStyle="rgba(110,255,190,"+(.6+.3*Math.sin(now/200))+")";ctx.lineWidth=6;ctx.lineCap="round";ctx.setLineDash([2,14]);ctx.lineDashOffset=-now/30;
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);}
  for(const it of mz.items)if(!it.got){const d=Math.hypot(it.x-mz.x,it.y-mz.y);if(d<320&&d>110)circ(it.x,it.y,3,"rgba(255,233,160,"+(.4+.4*Math.sin(now/200+it.x))+")");}
  for(const c of mz.closets){const d=Math.hypot(c.x-mz.x,c.y-mz.y);if(d<320&&d>110)circ(c.x,c.y-30,3,"rgba(200,160,110,"+(.35+.35*Math.sin(now/260+c.x))+")");}
  const gh=mz.ghost;if(gh.on){const d=Math.hypot(gh.x-mz.x,gh.y-mz.y);
    if(d<R0+20)ghost(gh.x,gh.y-6,.8,.9,true);else if(d<320){circ(gh.x-8,gh.y-26,3,"rgba(255,40,40,.9)");circ(gh.x+8,gh.y-26,3,"rgba(255,40,40,.9)");}}
  ctx.restore();
  if(mz.state==="exercise")mzExercise(mz.t);
  if(mz.state==="scare"){const u=mz.t;ctx.fillStyle="rgba(130,0,0,"+(.85-.5*Math.min(1,u))+")";ctx.fillRect(0,0,W,H);
    ghost(W/2+(rnd()-.5)*18,H*.52+(rnd()-.5)*18,(H*.75)/80*(.8+Math.min(1,u*4)*.5),1,true);}
  for(const q of parts){
    const a=q.k===1?1-q.life/q.max:(q.life>q.max-.8?(q.max-q.life)/.8:1);ctx.globalAlpha=Math.max(0,a);
    if(q.k===1){ctx.fillStyle="#ff3d6b";heartPath(q.x,q.y,q.s);ctx.fill();}
    else{ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/3,q.s,q.s*.66);ctx.restore();}
  }
  ctx.globalAlpha=1;
}
